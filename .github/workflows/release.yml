name: Release

# tag 只做触发器；版本号单一源头是 app/build.gradle.kts 的 versionName，
# 附件名恒定（TempRain.apk）供 README 直链 releases/latest/download/ 使用。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from source of truth
        id: ver
        run: echo "name=$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        # CI 上没有 local.properties：QWEATHER_KEY 注入为空串，
        # 发布的 APK 天然不含任何密钥（用户在 APP 内自行填写）
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_ALIAS_PASSWORD: ${{ secrets.KS_ALIAS_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$KS_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KS_ALIAS_PASSWORD"

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep "certificate DN"

      - name: Rename artifact
        run: cp app/build/outputs/apk/release/app-release.apk TempRain.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.name }}
          files: TempRain.apk
          generate_release_notes: true